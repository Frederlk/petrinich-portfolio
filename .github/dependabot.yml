# GitHub Actions only. `ci.yml` pins every action to a commit SHA, and a SHA pin that nothing updates silently stops receiving fixes.
#
# Only `uses:` lines change, so `package.json`, `pnpm-lock.yaml` and pnpm's release-age and trust policies are never touched. A release younger than the cooldown — the window a hijacked maintainer account exploits — is not proposed. Seven days, stricter than pnpm's two-day `minimumReleaseAge` and the minimum zizmor's `dependabot-cooldown` audit accepts; on a monthly schedule the extra days cost nothing. Every update lands in one grouped PR a month.
#
# No `target-branch`: updates go to the default branch. A project with a `dev` branch adds `target-branch: dev`.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
