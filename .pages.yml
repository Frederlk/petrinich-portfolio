# Pages CMS (https://pagescms.org): sign in at app.pagescms.org with GitHub, edit the forms below, and Save commits the file to the repository, which redeploys the site.
# This file mirrors the Zod schemas in schemas/. When a field is added or renamed there, change it here too, or the CMS and the build will disagree.
# Every file is parsed by Zod at build time (lib/content.ts), so a bad value fails the deploy instead of reaching the site.
# Numbers in text are written as placeholders the build fills from the data: {years}, {since}, {developersLed}, {peakTeam}, {hired}, {projects}, {technologies}, {led.<job id>}, {ledOrBuilt.<job id>}. An unknown placeholder fails the build.

media:
  input: public
  output: /

content:
  - name: profile
    label: Profile
    type: file
    path: content/profile.json
    format: json
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: title
        label: Job title
        type: string
        required: true
      - name: location
        label: Location
        type: string
        required: true
      - name: linkedinHeadline
        label: LinkedIn headline
        description: Pasted into LinkedIn by `bun linkedin`. Max 220 characters.
        type: string
        required: true
      - name: headline
        label: Home page headline
        description: Also the GitHub profile bio. Max 160 characters.
        type: text
        required: true
      - name: intro
        label: Home page intro
        description: Also used as the default meta description of the site.
        type: text
        required: true
      - name: summary
        label: CV summary
        description: Wrap a phrase in **double asterisks** to make it bold.
        type: text
        required: true
      - name: contacts
        label: Contacts
        description: Shown in the footer and the CV header. Use https://... or mailto:... links. The mailto entry feeds the "Hire me" and "Start a project" buttons, the entry labelled Telegram feeds the Telegram button.
        type: object
        list:
          collapsible:
            summary: "{label}"
        fields:
          - name: label
            label: Label
            type: string
            required: true
          - name: url
            label: URL
            type: string
            required: true
      - name: photo
        label: Photo
        description: Square photo, shown on the About page.
        type: image
        required: true

  - name: experience
    label: Experience
    type: file
    path: content/experience.json
    format: json
    list:
      collapsible:
        summary: "{company}: {role}"
    fields:
      - name: id
        label: ID
        description: Short lowercase key, no spaces, unique.
        type: string
        required: true
      - name: company
        label: Company
        type: string
        required: true
      - name: role
        label: Role
        type: string
        required: true
      - name: dates
        label: Dates
        description: 'Free text, for example "February 2024 – Present". An end date that is not "Present" marks the job as past.'
        type: string
        required: true
      - name: stack
        label: Stack
        type: string
        list: true
      - name: description
        label: Description
        type: text
        required: true
      - name: bullets
        label: Achievements
        description: One bullet per item. Wrap a phrase in **double asterisks** for bold or `backticks` for code.
        type: text
        list: true
      - name: team
        label: Team
        description: "Developers you led in this job: the site's developers-led total is the sum of Led, 'up to N at a time' the largest Peak, and hired the sum of Hired. Leave empty for a job without a team."
        type: object
        fields:
          - name: led
            label: Led
            type: number
            required: true
          - name: peak
            label: Peak at one time
            type: number
          - name: hired
            label: Hired
            type: number
      - name: links
        label: Links
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
            required: true
          - name: url
            label: URL
            type: string
            required: true

  - name: education
    label: Education, languages and interests
    type: file
    path: content/education.json
    format: json
    fields:
      - name: education
        label: Education
        type: object
        list: true
        fields:
          - name: school
            label: School
            type: string
            required: true
          - name: degree
            label: Degree
            type: string
            required: true
          - name: dates
            label: Dates
            type: string
            required: true
          - name: location
            label: Location
            type: string
            required: true
      - name: languages
        label: Languages
        type: object
        list: true
        fields:
          - name: name
            label: Language
            type: string
            required: true
          - name: level
            label: Level
            type: string
            required: true
      - name: interests
        label: Interests
        description: Wrap a phrase in **double asterisks** to make it bold.
        type: text
        required: true

  - name: technologies
    label: Technologies
    type: file
    path: content/technologies.json
    format: json
    list:
      collapsible:
        summary: "{name}"
    fields:
      - name: id
        label: ID
        description: Lowercase key, no spaces. Projects, early work and the CV skills list refer to a technology by this id.
        type: string
        required: true
      - name: name
        label: Name
        type: string
        required: true
      - name: group
        label: Group
        description: The heading on /stack, for example "Core stack".
        type: string
        required: true
      - name: aliases
        label: Aliases
        type: string
        list: true
      - name: listedByOwner
        label: Listed by owner
        description: "Tick for a technology you list without a project behind it. /stack shows it as a chip with no count and no link, until a project uses it."
        type: boolean

  - name: cv-skills
    label: CV skills
    type: file
    path: content/cv-skills.json
    format: json
    fields:
      - name: skills
        label: Technology ids
        description: The ids of the technologies listed in the short skills section of /cv, grouped by their technology group in this order.
        type: string
        list: true

  - name: projects
    label: Projects
    type: file
    path: content/projects.json
    format: json
    list:
      collapsible:
        summary: "{name}"
    fields:
      - name: id
        label: ID
        description: Short lowercase key, no spaces, unique. It is the URL of the project page, /work/<id>.
        type: string
        required: true
      - name: name
        label: Name
        description: For an anonymous project, write the generic name that may be shown publicly.
        type: string
        required: true
      - name: anonymous
        label: Anonymous
        description: When ticked, the site never shows a link to the project.
        type: boolean
      - name: kind
        label: Kind
        type: select
        required: true
        options:
          values:
            - value: client
              label: Client
            - value: freelance
              label: Freelance
            - value: internal
              label: Internal
            - value: personal
              label: Personal
      - name: year
        label: Year
        type: number
      - name: status
        label: Status
        type: select
        options:
          values:
            - value: live
              label: Live
            - value: in-progress
              label: In progress
            - value: completed
              label: Completed
            - value: unfinished
              label: Unfinished
      - name: role
        label: My role
        type: select
        required: true
        options:
          values:
            - value: sole
              label: Sole developer
            - value: lead
              label: Lead developer
            - value: project-lead
              label: Project lead
            - value: team
              label: Team member
            - value: estimate-only
              label: Estimate only
      - name: roleNote
        label: Role note
        description: One line on what exactly I did.
        type: text
      - name: summary
        label: Summary
        type: text
        required: true
      - name: features
        label: Features
        type: string
        list: true
      - name: employer
        label: Employer
        description: 'The experience ID of the job this project was done in ("ux-mind", "freelance", "ceviant", "tapston"). Empty for your own projects. Counts per job are derived from it.'
        type: string
      - name: domain
        label: Domain
        description: 'One or two of the fixed industry keys in lib/labels.ts, for example "ai", "e-commerce". The value "ai" switches on the AI badge and the AI filter on /work.'
        type: string
        list: true
      - name: scope
        label: Scope
        description: 'For example "frontend", "backend", "devops".'
        type: string
        list: true
      - name: stack
        label: Stack
        description: Technology ids from the Technologies file. An unknown id fails the build.
        type: string
        list: true
      - name: links
        label: Links
        description: Ignored for anonymous projects. The first one is the project's public link.
        type: object
        list: true
        fields:
          - name: type
            label: Type
            description: 'For example "live".'
            type: string
            required: true
          - name: url
            label: URL
            type: string
            required: true
      - name: media
        label: Screenshots
        type: image
        list: true
      - name: featured
        label: Featured on the home page
        type: boolean
      - name: aiOrchestrated
        label: Built by orchestrating AI agents
        type: boolean
      - name: caseStudy
        label: Case study
        description: Id of the file in content/case-studies (without .mdx). Leave empty for the short record (saved as null).
        type: string

  - name: early-work
    label: Early work
    type: file
    path: content/early-work.json
    format: json
    list:
      collapsible:
        summary: "{title}"
    fields:
      - name: id
        label: ID
        description: Short key, no spaces, unique.
        type: string
        required: true
      - name: title
        label: Title
        type: string
        required: true
      - name: year
        label: Year
        type: number
        required: true
      - name: summary
        label: Summary
        type: text
        required: true
      - name: stack
        label: Stack
        description: Technology ids from the Technologies file. An unknown id fails the build.
        type: string
        list: true
      - name: links
        label: Links
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
            required: true
          - name: url
            label: URL
            type: string
            required: true

  - name: case-studies
    label: Case studies
    type: collection
    path: content/case-studies
    extension: mdx
    format: raw
    exclude:
      - README.mdx
    fields:
      - name: body
        label: Case study (MDX)
        description: 'File name = project id; set the same id in the project''s "Case study" field.'
        type: code
        options:
          format: markdown
